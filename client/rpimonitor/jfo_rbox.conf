# get box inforamtion
# need to set the daemon.timeout=20 in daemon.conf

# Name of the left menu
web.status.4.name=RBox

# Get data
dynamic.1.name=box_stats
# Pour interroger toutes les 10mn
# /bin/bash -c "m=\$(expr \$(date '+%M') % 10); if [[ \$m == 0 ]]; then rm -f /tmp.ram/box_status.txt && python3 /home/jerome/bin/rbox_status2.py -u admin -p jx4va42 --minimal --output /tmp.ram/box_status.txt ; date >> /tmp.ram/box_status.txt ; fi"
# ou bien "interval" : nb de fois par rapport a la conf dans daemon.delay
# 14/06 9:31 : passe a interval 1
# 15/06 10:53 : repasse a 10, mais met un default, change aussi le network.conf
# 19/06 7:37 remet interval 10
dynamic.1.interval=10
dynamic.1.source=python3 /home/jerome/bin/rbox_status2.py -u admin -p jx4va42 --minimal --output /tmp.ram/box_status.txt --bandwidth
dynamic.1.regexp=(.*)
dynamic.1.postprocess=
dynamic.1.rrd=

dynamic.10.name=box_rx_bandwidth
dynamic.10.source=/tmp.ram/box_status.txt
dynamic.10.regexp=wanRxBandwidth: (.*)
dynamic.10.rrd=GAUGE
dynamic.10.postprocess=$1*-1
dynamic.10.default=U
#dynamic.10.max=0

dynamic.11.name=box_tx_bandwidth
dynamic.11.source=/tmp.ram/box_status.txt
dynamic.11.regexp=wanTxBandwidth: (.*)
dynamic.11.rrd=GAUGE
dynamic.11.postprocess=$1/1
dynamic.11.default=U
#dynamic.11.min=0

dynamic.12.name=box_rx_bytes
dynamic.12.source=/tmp.ram/box_status.txt
dynamic.12.regexp=wanRx: (.*)
dynamic.12.rrd=GAUGE
dynamic.12.postprocess=$1*-1

dynamic.13.name=box_tx_bytes
dynamic.13.source=/tmp.ram/box_status.txt
dynamic.13.regexp=wanTx: (.*)
dynamic.13.rrd=GAUGE
dynamic.13.postprocess=

dynamic.20.name=nbconnected
dynamic.20.source=/tmp.ram/box_status.txt
dynamic.20.regexp=nbDeviceUp: (.*)
dynamic.20.rrd=GAUGE
dynamic.20.postprocess=

dynamic.21.name=connected
dynamic.21.source=cat /tmp.ram/box_status.txt | grep --color=never -Po 'name:\s*\K.*' | sort --ignore-case | tr '\n' ' '
dynamic.21.regexp=(.*)
dynamic.21.postprocess=
dynamic.21.rrd=

dynamic.22.name=box_status
dynamic.22.source=/tmp.ram/box_status.txt
dynamic.22.regexp=linkStatus: (.*)
dynamic.22.rrd=GAUGE
dynamic.22.postprocess=

dynamic.23.name=box_rx_db
dynamic.23.source=/tmp.ram/box_status.txt
dynamic.23.regexp=routerOpticalInterface: .*\|(.*)dBm\|.*\|.*
dynamic.23.rrd=GAUGE
dynamic.23.postprocess=

dynamic.24.name=box_tx_db
dynamic.24.source=/tmp.ram/box_status.txt
dynamic.24.regexp=routerOpticalInterface: .*\|.*\|(.*)dBm\|.*
dynamic.24.rrd=GAUGE
dynamic.24.postprocess=

#dynamic.23.name=download_speed
#dynamic.23.source=/tmp.ram/downloadspeed.txt
#dynamic.23.regexp=(.*) MB
#dynamic.23.rrd=GAUGE
#dynamic.23.postprocess=$1*1



# Status page
web.status.4.content.1.name=RBox
web.status.4.content.1.icon=network.png
web.status.4.content.1.line.1="Status : " + data.box_status+ " " + Badge(data.box_status,"==-1","Error","danger")+" "+Badge(data.box_status,"==0","Stopped","default") + "" + Badge(data.box_status,"==1","Starting","primary") + "" + Badge(data.box_status,"==2","Running","success")
web.status.4.content.1.line.2="RX Bandwith : <b>" + KMG(Math.abs(data.box_rx_bandwidth)) + "/s</b>"
web.status.4.content.1.line.3="TX Bandwith : <b>" + KMG(Math.abs(data.box_tx_bandwidth)) + "/s</b>"
web.status.4.content.1.line.4="RX Data: <b>"+KMG(Math.abs(data.box_rx_bytes)) + "<i class='icon-arrow-up'></i></b>"
web.status.4.content.1.line.5="TX Data: <b>"+KMG(Math.abs(data.box_tx_bytes)) + "<i class='icon-arrow-down'></i></b>"
web.status.4.content.1.line.6="Devices connected : <b>" + data.nbconnected + "</b>" + ShowInfo('devices', 'Connected devices', data.connected)
web.status.4.content.1.line.7="<code>asqw xzcd fefr gtbt hynu jiko lo1A QWXS Z23E DCVF R45T GBNH Y6UJ N78I OPSH EUT</code>"
web.status.4.content.1.line.8="Optical power : RX "+data.box_rx_db+" dBm ; TX "+data.box_tx_db+" dBm"


# Statistics page
web.statistics.5.name=RBox

web.statistics.5.content.1.name=BoxBandwidth
web.statistics.5.content.1.graph_options.tooltipOpts={ content: "<h4>%s</h4> Value: %y.0<br/>At: %x", dateFormat:"%y-%0m-%0d %H:%M" }
web.statistics.5.content.1.graph.1=box_tx_bandwidth
web.statistics.5.content.1.graph.2=box_rx_bandwidth
web.statistics.5.content.1.ds_graph_options.tx_bandwidth.label=Upload bandwidth (bytes)
web.statistics.5.content.1.ds_graph_options.tx_bandwidth.lines={ fill: true }
web.statistics.5.content.1.ds_graph_options.tx_bandwidth.color="#FF7777"
web.statistics.5.content.1.ds_graph_options.rx_bandwidth.label=Download bandwidth (bytes)
web.statistics.5.content.1.ds_graph_options.rx_bandwidth.lines={ fill: true }
web.statistics.5.content.1.ds_graph_options.rx_bandwidth.color="#77FF77"
web.statistics.5.content.1.graph_options.yaxis={ tickFormatter: function (v) { if (Math.abs(v) > 1048576) return (Math.round(v*10/1000/1000)/10) + " MiB/s" ; if (Math.abs(v) > 1024) return (Math.round(v*10/1000)/10) + " KiB/s" ; else return v + " B/s" }, }

web.statistics.5.content.2.name=Bytes
web.statistics.5.content.2.graph_options.tooltipOpts={ content: "<h4>%s</h4> Value: %y.0<br/>At: %x", dateFormat:"%y-%0m-%0d %H:%M" }
web.statistics.5.content.2.graph.1=box_tx_bytes
web.statistics.5.content.2.graph.2=box_rx_bytes
web.statistics.5.content.2.ds_graph_options.tx_bytes.label=Upload bytes
web.statistics.5.content.2.ds_graph_options.rx_bytes.label=Download bytes
web.statistics.5.content.2.graph_options.yaxis={ tickFormatter: function (v) { if (Math.abs(v) > 1048576) return (Math.round(v*10/1000/1000)/10) + " MB" ; if (Math.abs(v) > 1024) return (Math.round(v*10/1000)/10) + " KB" ; else return v + " B/s" }, }

web.statistics.5.content.3.name=Devices
web.statistics.5.content.3.graph_options.tooltipOpts={ content: "<h4>%s</h4> Value: %y.0<br/>At: %x", dateFormat:"%y-%0m-%0d %H:%M" }
web.statistics.5.content.3.graph.1=nbconnected
web.statistics.5.content.3.ds_graph_options.nbconnected.label=Nb connected

web.statistics.5.content.4.name=Status
web.statistics.5.content.4.graph_options.tooltipOpts={ content: "<h4>%s</h4> Value: %y.0<br/>At: %x", dateFormat:"%y-%0m-%0d %H:%M" }
web.statistics.5.content.4.graph.1=box_status
web.statistics.5.content.4.ds_graph_options.box_status.label=Box status

web.statistics.5.content.5.name=OpticalPower
web.statistics.5.content.5.graph_options.tooltipOpts={ content: "<h4>%s</h4> Value: %y.0<br/>At: %x", dateFormat:"%y-%0m-%0d %H:%M" }
web.statistics.5.content.5.graph.1=box_rx_db
web.statistics.5.content.5.graph.2=box_tx_db
web.statistics.5.content.5.ds_graph_options.box_rx_db.label=RX dBm
web.statistics.5.content.5.ds_graph_options.box_tx_db.label=TX dBm




